####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: qodana-python
profile:
  name: qodana.recommended

bootstrap: pip install uv && uv pip install --system -e ./backend

exclude:
  - name: All
    paths:
      - backend/tests
      - backend/alembic
      - frontend
      - .codegraph
      - docs
      - scripts
  - name: PyInitCodeInspection
  - name: PyMethodMayBeStaticInspection

include:
  - name: CheckDependencyLicenses
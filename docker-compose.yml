services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: guranovel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guranovel"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/guranovel
      WORKSPACE_BASE_DIR: /data/workspaces
      APP_ENV: production
      APP_DEBUG: "false"
      READER_PANEL_MODE: "off"
    volumes:
      - workspaces_data:/data/workspaces
    ports:
      - "${GURANOVEL_BIND_ADDRESS:-127.0.0.1}:${GURANOVEL_BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${GURANOVEL_BIND_ADDRESS:-127.0.0.1}:${GURANOVEL_FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  workspaces_data:

name: style_sensitive
version: v1
description: Prose- and style-sensitive reader evaluating text cadence, word choice efficiency, clarity, and repetition.
agent_role: reader_agent
model:
  provider: fake
  model: deterministic-reader-panel-v1
  temperature: 0.2
  top_p: 1.0
  max_tokens: 4096
  response_format: json_schema
permissions:
  can_read:
    - manuscript_segments
    - project_info
    - test_goals
    - issue_context
  can_write: []
  cannot:
    - network
    - credentials
    - filesystem
    - database
    - orm
    - document_service
    - document_versions
    - workflow_transitions
    - editorial_decisions
context_policy:
  required:
    - project_id
    - chapter_id
    - workflow_run_id
    - reader_profile_id
  optional: []
  max_context_tokens: 16384
system_prompt: You are a prose- and style-conscious reader. Focus on reading cadence, descriptive efficiency, dialogue flow, and clarity.
output_schema: reader_panel_output

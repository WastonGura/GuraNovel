name: moderator_agent
mode: issue_extraction
version: v1
description: Moderator agent extracting and deduplicating standardized issues from reader initial reports.
agent_role: moderator_agent
model:
  provider: fake
  model: deterministic-moderator-v1
  temperature: 0.0
  top_p: 1.0
  max_tokens: 4096
  response_format: json_schema
permissions:
  can_read:
    - reader_initial_reports
    - manuscript_segments
  can_write: []
  cannot:
    - network
    - credentials
    - filesystem
    - database
    - orm
    - document_service
    - document_versions
    - workflow_transitions
    - vote
    - cast_ballot
context_policy:
  required:
    - project_id
    - chapter_id
    - workflow_run_id
  optional: []
  max_context_tokens: 16384
system_prompt: You are the neutral discussion moderator. Extract standardized issues from initial reader reports, combine equivalent concerns, and anchor all issues to specific segment IDs. You cannot vote.
output_schema: moderator_issue_extraction_output

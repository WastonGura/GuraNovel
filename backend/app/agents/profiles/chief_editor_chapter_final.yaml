name: chief_editor
mode: chapter_final
version: v1
description: Review one exact chapter candidate for final reader value without editing it.
agent_role: chief_editor_agent
model:
  provider: fake
  model: deterministic-chief-editor-chapter-final-v1
  temperature: 0.0
  top_p: 1.0
  max_tokens: 4096
  response_format: json_schema
permissions:
  can_read:
    - target_chapter
    - approved_outline
    - chief_editor_context
  can_write: []
  cannot:
    - network
    - credentials
    - filesystem
    - database
    - orm
    - document_service
    - document_versions
    - revise_chapter
    - approve_actions
    - resolve_actions
    - workflow_transitions
context_policy:
  required:
    - project_id
    - chapter_id
    - workflow_run_id
    - target
    - approved_outline
    - contexts
  optional: []
  max_context_tokens: 32768
system_prompt: Return only an advisory final-quality report bound to the supplied chapter version. Never rewrite text, persist, approve actions, resolve actions, or transition workflow state.
output_schema: chapter_review_report

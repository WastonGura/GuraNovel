name: lore_agent
mode: maintenance_impact
version: v1
description: Analyze canonical lore impact without modifying project documents.
agent_role: lore_agent
model:
  provider: fake
  model: deterministic-lore-impact-v1
  temperature: 0.0
  top_p: 1.0
  max_tokens: 2048
  response_format: json_schema
permissions:
  can_read:
    - maintenance_context
    - document_refs
  can_write: []
  cannot:
    - network
    - credentials
    - document_versions
context_policy:
  required:
    - project_id
    - workflow_run_id
    - change_request
    - document_refs
  optional: []
  max_context_tokens: 8192
system_prompt: Analyze lore impact and return only the declared schema. Never modify documents.
output_schema: lore_maintenance_impact_output

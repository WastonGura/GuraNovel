name: archivist_agent
mode: apply_change
version: v1
description: Propose approved replacement bodies without writing canonical project documents.
agent_role: archivist_agent
model:
  provider: fake
  model: deterministic-archivist-apply-v1
  temperature: 0.0
  top_p: 1.0
  max_tokens: 16384
  response_format: json_schema
permissions:
  can_read:
    - maintenance_context
    - approved_revision_plan
  can_write:
    - proposed_changes
  cannot:
    - network
    - credentials
    - filesystem
    - database
    - document_service
    - document_versions
context_policy:
  required:
    - project_id
    - workflow_run_id
    - change_request_id
    - approval_id
    - revision_plan_id
    - revision_plan_document_id
    - revision_plan_version_id
    - operations
  optional: []
  max_context_tokens: 32768
system_prompt: Return only proposed replacement bodies linked to approved server references. Never call services or write canonical content.
output_schema: apply_change_output

[project]
name = "guranovel-backend"
version = "0.8.0"
description = "FastAPI backend for GuraNovel."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6,<7",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration' -x"
markers = [
    "integration: requires an explicit PostgreSQL test database",
]

[tool.ruff]
line-length = 100
target-version = "py311"
